# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies, so
# `charly box validate` at the repo root exits 0 on ANY manifest, including one with a malformed
# `plugin.providers` entry (opencharly/charly#459). Declaring `discover:` is the whole fix: the
# candy is scanned and the CUE-schema gate applies.
discover:
    - path: candy
      recursive: true

# =============================================================================
# The R10 witness for this plugin's first slice.
#
# The substrate's point is that a microVM runs on THIS host, so the bed's target IS the host: a
# `local:` deploy marked `disposable: true` (the ONE authorization for autonomous rebuild). Its
# plan dispatches the plugin's own `firecracker:` verb, which is reached in-process when the plugin
# is compiled in and out-of-process when it is served from this repo — either way the step asserts a
# LIVE answer about the host rather than a fixture: the KVM device and its mode, the VMM binary and
# the version it reports, the artefacts, the containerd socket and whether the CONFIGURED
# snapshotter can back a root drive, and the forwarding posture.
#
# The launch leg extends this bed with the microVM steps (boot → guest IP → SSH → the in-guest
# candy's plan), which is the R10 proof the umbrella ledger's WI-13 owns.
#
# THE TEMPLATE/DEPLOY SPLIT MIRRORS check-substrate: the template is the recipe applied on the
# destination, and the deploy names it — so the same recipe serves an operator running it by hand
# and the bed running it on a disposable target. The `from:` ref needs a SAME-PROJECT template, and
# this repo imports main for nothing, so the template is local.
# =============================================================================
check-firecracker-host-app:
    local:
        # The HOST layer is the bed's own prerequisite, and it is a repo ref rather than a copy: the
        # layer that installs the pinned VMM + kernel onto a host is `opencharly/layer-firecracker`, and
        # one implementation of "install the VMM" is the point (R2). It applies root-scoped steps —
        # exactly the work this bed exists to exercise on a disposable target.
        candy:
            - '@github.com/opencharly/layer-firecracker'
        # Explicit placeholder for the plan's non-candy content.
        description: |-
            The recipe the firecracker host bed applies: the pinned host layer, then the two checks that
            matter — what this host can do, and whether the API client speaks the VMM's own protocol.
        plan:
            - run: create the scratch root drive the client's lease points at
              id: firecracker-probe-drive
              command: |
                set -eu
                # The `vmm` probe CONFIGURES a drive; it does not boot it, because a boot needs a real
                # rootfs artefact and that is the producer leg's job (ledger WI-7). So the drive only has
                # to exist and be a filesystem the VMM will accept.
                F=/tmp/charly-fc-probe-rootfs.ext4
                if [ ! -f "$F" ]; then
                  truncate -s 64M "$F"
                  mke2fs -q -t ext4 -F "$F"
                fi
              run_as: root
            - check: the host can boot a microVM — KVM, the VMM, the kernel, containerd, and the snapshotter the daemon actually SERVES
              id: firecracker-host-preconditions
              firecracker:
                  method: doctor
                  kernel: /var/lib/firecracker/kernels/5.10/vmlinux
            - check: the API client speaks the VMM's own protocol — the real binary accepts a whole lease and we read the documents back
              id: firecracker-client-protocol
              firecracker:
                  method: vmm
                  kernel: /var/lib/firecracker/kernels/5.10/vmlinux
                  rootfs: /tmp/charly-fc-probe-rootfs.ext4

check-firecracker-host:
    local:
        from: check-firecracker-host-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            Sole R10 witness of the firecracker substrate plugin: the pinned VMM + kernel are installed
            by opencharly/layer-firecracker onto this disposable target, the host is then asked what it
            can actually do (KVM, the VMM and the version it answers, the fireactions kernel, containerd
            and the snapshotter the daemon really serves), and the API client is proved against the REAL
            VMM binary — it configures a whole lease and reads the decisive documents back. The guest
            boot (a real rootfs, SSH into the guest, an in-guest plan) lands with the producer leg.
