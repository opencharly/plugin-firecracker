# The producer's R10 bed IMAGE: everything `charly firecracker image build` needs to run inside a
# disposable pod — the charly CLI, a nested rootless engine (whose network resolves, unlike the host's
# rootful one), the pinned kernel the emitted artefact must ship, and the plugin itself.
#
# THE REF IS THE BRANCH, deliberately: `bake_plugin` compiles from the repo at the pinned ref and the scan
# then sees THAT ref's entity set. Pinning a release tag predating this work made the bed's own project
# candies unresolvable — measured, and the reason this bed could not exist before the work was pushed.
# Pointing at the branch means the bed is exercised against the very tree under review.
#
# The project it builds from is written in by `producer-bed-project`, because a pod has no checkout.
producer-bed-image:
    candy:
        description: The artefact producer's own environment — charly, a nested rootless engine, the pinned kernel, the plugin baked from the branch under review, and the project it builds.
        distro: [fedora]
        build: [rpm]
        base: quay.io/fedora/fedora:43
        candy:
            # The charly binary, and the ONE reason this bed cannot build yet.
            #
            # The org's bed convention is `charly-dev`, the local-source install — but its own doc says it
            # is "consumed by bare name from the charly checkout" and that "a remote fetch of it is not a
            # valid use: the binary is gitignored", so a bed in ANOTHER repo cannot compose it. That leaves
            # the packaged route, which currently pins an exact RPM version the rolling repository has
            # rolled past: `No match for argument: charly-2026.268.1917`
            # (opencharly/layer-charly#17). So this bed VALIDATES and cannot yet BUILD, and the block is an
            # org defect that is filed, measured, and not worked around: hand-installing a binary would make
            # the bed prove something the product cannot do.
            - '@github.com/opencharly/layer-charly:v2026.274.0345'
            - '@github.com/opencharly/layer-container-nesting:v2026.271.2309'
            - '@github.com/opencharly/layer-firecracker/candy/layer-firecracker:v2026.287.1531'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
            - producer-bed-env
